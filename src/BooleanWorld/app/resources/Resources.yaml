    - type: "ProtoEntity"
      name: "Player"
      DependentResources:
        DependentResource:
          id: "Animations"
          ref: "/EntityAnimations"
      Definitions:
        Definition:
          Properties:
            Physical:
              Collision: "true"
              Size:
                type: "AABB"
                value: "40,40"
            Visual:
              Animation:
                key: "idle"
                value: "Circle"
    - type: "AudioBank"
      name: "Bank.Master"
      location: "audio/Themes/Build/Desktop/Master.bank"
    - type: "AudioBank"
      name: "Bank.Strings"
      location: "audio/Themes/Build/Desktop/Master.strings.bank"
    - type: "AudioBank"
      name: "Bank.Themes"
