    - type: "Image"
      name: "TestTexture"
      location: "images/test.png"
    - type: "Image"
      name: "Floor5"
      location: "images/floor5.png"
    - type: "Image"
      name: "Floor6"
      location: "images/floor6.png"
  Namespace:
    name: "World"
    Resource:
      - type: "Shader"
        name: "WorldVertexShader"
        location: "shaders/world.vert"
      - type: "Shader"
        name: "WorldFragmentShader"
        location: "shaders/world.frag"
        Definitions:
          Definition:
            textures: "1"
      - type: "Program"
        name: "WorldProgram"
        DependentResources:
          DependentResource:
            - id: "Vertex"
              ref: "WorldVertexShader"
            - id: "Fragment"
              ref: "WorldFragmentShader"
        Definitions:
          Definition:
            Attribs:
              textures: "1"
            MeshSpecification:
              primitive: "triangles"
              indexed: "false"
              storage: "dynamic"
              Buffers:
                Buffer:
                  - Channels:
                      Channel:
                        - data: "position3"
                          type: "float32"
                        - data: "normal3"
                          type: "float32"
                  - Channels:
                      Channel:
                        - data: "texcoord2"
                          type: "float32"
                        - data: "colour4"
                          type: "uint8"
                          normalised: "true"
      - type: "Material"
        name: "Material.Default"
        DependentResources:
          DependentResource:
            - id: "Program"
              ref: "WorldProgram"
            - id: "Texture"
              ref: "/Floor5"
        Definitions:
          Definition:
            Textures:
              Texture:
                sampler: "TEX1"
                type: "resource"
                value: "Texture"
      - type: "TextFile"
        name: "WorldFile"
        location: "world-test-1.yaml"
      - type: "Map"
        name: "World"
        DependentResources:
          DependentResource:
            id: "Yaml"
            ref: "WorldFile"
        Definitions:
          Definition:
            factory: "BooleanWorld"
            Resource: "Yaml"
