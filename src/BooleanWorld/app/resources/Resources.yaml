      DependentResources:
        DependentResource:
          id: "Animations"
          ref: "/EntityAnimations"
      Definitions:
        Definition:
          Properties:
            Physical:
              Collision: "true"
              Size:
                type: "AABB"
                value: "40,40"
            Visual:
              Animation:
                key: "idle"
                value: "Circle"
    - type: "AudioBank"
