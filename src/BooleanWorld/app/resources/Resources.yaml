      name: "Floor6"
      location: "images/floor6.png"
  Namespace:
    name: "World"
    Resource:
      - type: "Image"
        name: "JaguarTangentSpaceNormalMap"
        location: "images/jaguar_tangent_space_normal_map.png"
        Option:
          - name: "colour-space"
            value: "linear"
          - name: "wrapping"
            value: "repeat"
          - name: "mipmaps"
            value: "true"
      - type: "Shader"
        name: "WorldVertexShader"
        location: "shaders/world.vert"
      - type: "Shader"
        name: "WorldFragmentShader"
        location: "shaders/world_pbr.frag"
        Definitions:
          Definition:
            textures: "1"
      - type: "Shader"
        name: "WorldHorizontal2dFragmentShader"
        location: "shaders/world_pbr_2d.frag"
        Definitions:
          Definition:
            textures: "1"
      - type: "Shader"
        name: "FragmentOverdrawShader"
        location: "shaders/fragment_overdraw.frag"
      - type: "Shader"
        name: "FragmentOverdrawResolveShader"
        location: "shaders/fragment_overdraw_resolve.frag"
        Definitions:
          Definition:
            textures: "1"
      - type: "Shader"
        name: "PlayerTorchMarkerVertexShader"
        location: "shaders/player_torch_marker.vert"
      - type: "Shader"
        name: "PlayerTorchMarkerFragmentShader"
        location: "shaders/player_torch_marker.frag"
      - type: "Shader"
        name: "VignetteVertexShader"
        location: "shaders/vignette.vert"
      - type: "Shader"
        name: "VignetteFragmentShader"
        location: "shaders/vignette.frag"
        Definitions:
          Definition:
            textures: "1"
      - type: "Program"
        name: "WorldProgram"
        DependentResources:
          DependentResource:
            - id: "Vertex"
              ref: "WorldVertexShader"
            - id: "Fragment"
              ref: "WorldFragmentShader"
        Definitions:
          Definition:
            Attribs:
              textures: "1"
            MeshSpecification:
              primitive: "triangles"
              indexed: "false"
              storage: "dynamic"
              Buffers:
                Buffer:
                  - Channels:
                      Channel:
                        - data: "position3"
                          type: "float32"
                        - data: "normal3"
                          type: "float32"
                  - Channels:
                      Channel:
                        - data: "texcoord2"
                          type: "float32"
                        - data: "colour4"
                          type: "uint8"
                          normalised: "true"
                        - data: "user1"
                          type: "float32"
      - type: "Program"
        name: "WorldHorizontal2dProgram"
        DependentResources:
          DependentResource:
            - id: "Vertex"
              ref: "WorldVertexShader"
            - id: "Fragment"
              ref: "WorldHorizontal2dFragmentShader"
        Definitions:
          Definition:
            Attribs:
              textures: "1"
            MeshSpecification:
              primitive: "triangles"
              indexed: "false"
              storage: "dynamic"
              Buffers:
                Buffer:
                  - Channels:
                      Channel:
                        - data: "position3"
                          type: "float32"
                        - data: "normal3"
                          type: "float32"
                  - Channels:
                      Channel:
                        - data: "texcoord2"
                          type: "float32"
                        - data: "colour4"
                          type: "uint8"
                          normalised: "true"
                        - data: "user1"
                          type: "float32"
      - type: "Program"
        name: "FragmentOverdrawProgram"
        DependentResources:
          DependentResource:
            - id: "Vertex"
              ref: "WorldVertexShader"
            - id: "Fragment"
              ref: "FragmentOverdrawShader"
        Definitions:
          Definition:
            Attribs: {}
            MeshSpecification:
              primitive: "triangles"
              indexed: "false"
              storage: "dynamic"
              Buffers:
                Buffer:
                  - Channels:
                      Channel:
                        - data: "position3"
                          type: "float32"
                        - data: "normal3"
                          type: "float32"
                  - Channels:
                      Channel:
                        - data: "texcoord2"
                          type: "float32"
                        - data: "colour4"
                          type: "uint8"
                          normalised: "true"
                        - data: "user1"
                          type: "float32"
      - type: "Program"
        name: "FragmentOverdrawResolveProgram"
        DependentResources:
          DependentResource:
            - id: "Vertex"
              ref: "VignetteVertexShader"
            - id: "Fragment"
              ref: "FragmentOverdrawResolveShader"
        Definitions:
          Definition:
            Attribs:
              textures: "1"
            MeshSpecification:
              primitive: "triangles"
              indexed: "false"
              storage: "static"
              Buffers:
                Buffer:
                  Channels:
                    Channel:
                      - data: "position2"
                        type: "float32"
                      - data: "texcoord2"
                        type: "float32"
      - type: "Program"
        name: "PlayerTorchMarkerProgram"
        DependentResources:
          DependentResource:
            - id: "Vertex"
              ref: "PlayerTorchMarkerVertexShader"
            - id: "Fragment"
              ref: "PlayerTorchMarkerFragmentShader"
        Definitions:
          Definition:
            Attribs: {}
            MeshSpecification:
              primitive: "triangles"
              indexed: "true"
              storage: "static"
              Buffers:
                Buffer:
                  Channels:
                    Channel:
                      data: "position3"
                      type: "float32"
      - type: "Program"
        name: "VignetteProgram"
        DependentResources:
          DependentResource:
            - id: "Vertex"
              ref: "VignetteVertexShader"
            - id: "Fragment"
              ref: "VignetteFragmentShader"
        Definitions:
          Definition:
            Attribs:
              textures: "1"
            MeshSpecification:
              primitive: "triangles"
              indexed: "false"
              storage: "static"
              Buffers:
                Buffer:
                  Channels:
                    Channel:
                      - data: "position2"
                        type: "float32"
                      - data: "texcoord2"
                        type: "float32"
      - type: "Material"
        name: "Material.PlayerTorchMarker"
        DependentResources:
          DependentResource:
            id: "Program"
            ref: "PlayerTorchMarkerProgram"
        Definitions:
          Definition:
            Textures: {}
      - type: "Material"
        name: "Material.FragmentOverdraw"
        DependentResources:
          DependentResource:
            id: "Program"
            ref: "FragmentOverdrawProgram"
        Definitions:
          Definition:
            Textures: {}
      - type: "Material"
        name: "Material.Horizontal2d"
        DependentResources:
          DependentResource:
            - id: "Program"
              ref: "WorldHorizontal2dProgram"
            - id: "Texture"
              ref: "/Floor5"
        Definitions:
          Definition:
            Textures:
              Texture:
                sampler: "TEX1"
                type: "resource"
                value: "Texture"
      - type: "Material"
        name: "Material.Default"
        DependentResources:
          DependentResource:
            - id: "Program"
              ref: "WorldProgram"
            - id: "Texture"
              ref: "/Floor5"
        Definitions:
          Definition:
            Textures:
              Texture:
                sampler: "TEX1"
                type: "resource"
                value: "Texture"
      - type: "TextFile"
        name: "WorldFile"
        location: "world-test-1.yaml"
      - type: "Map"
        name: "World"
        DependentResources:
          DependentResource:
            id: "Yaml"
            ref: "WorldFile"
        Definitions:
          Definition:
            factory: "BooleanWorld"
            Resource: "Yaml"
